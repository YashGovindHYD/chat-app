info:
  name: Verify User OTP
  type: http
  seq: 2

http:
  method: POST
  url: "{{url}}/auth/verify-otp"
  body:
    type: json
    data: |-
      {
        "otp_code":"3916",
        "email":"yashgovind123@gmail.com"
      }
  auth: inherit

runtime:
  variables:
    - name: url
      value: http://127.0.0.1:8000
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) {
          bru.setGlobalEnvVar("access_token", res.body.access_token);
          bru.setGlobalEnvVar("refresh_token", res.body.refresh_token);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
