<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat</title>
    <style>
        :root {
            --accent: #6366f1;
            --accent-dark: #4f46e5;
            --bg: #eef0f7;
            --card: #ffffff;
            --text: #1e2130;
            --text-muted: #8a8fa3;
            --border: #e4e6ef;
            --bubble-other: #f2f3f8;
            --online: #22c55e;
            --offline: #ef4444;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #14151f;
                --card: #1b1d2a;
                --text: #eef0f7;
                --text-muted: #8a8fa3;
                --border: #2a2d3d;
                --bubble-other: #262838;
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* ---------- Join screen ---------- */
        #joinScreen {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 40px 36px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 20px 50px rgba(20, 21, 31, 0.12);
            text-align: center;
        }

        #joinScreen .logo {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--accent), #a855f7);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px;
            font-size: 26px;
        }

        #joinScreen h1 {
            font-size: 20px;
            margin: 0 0 6px;
        }

        #joinScreen p.sub {
            color: var(--text-muted);
            font-size: 13.5px;
            margin: 0 0 24px;
        }

        #joinScreen input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-size: 14px;
            margin-bottom: 12px;
            outline: none;
            transition: border-color 0.15s;
        }

        #joinScreen input:focus {
            border-color: var(--accent);
        }

        #joinScreen button {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            color: white;
            font-size: 14.5px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 6px;
            transition: transform 0.1s, opacity 0.15s;
        }

        #joinScreen button:hover {
            opacity: 0.92;
        }

        #joinScreen button:active {
            transform: scale(0.98);
        }

        /* ---------- Chat screen ---------- */
        #chatScreen {
            display: none;
            width: 100%;
            max-width: 480px;
            height: 88vh;
            max-height: 720px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(20, 21, 31, 0.12);
            overflow: hidden;
            flex-direction: column;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        header .room-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        header .room-icon {
            width: 38px;
            height: 38px;
            border-radius: 11px;
            background: linear-gradient(135deg, var(--accent), #a855f7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: white;
            font-size: 14px;
            text-transform: uppercase;
        }

        header .room-name {
            font-weight: 600;
            font-size: 15px;
        }

        header .status {
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        header .status .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--offline);
        }

        header .status .dot.connected {
            background: var(--online);
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.2);
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 18px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        #messages::-webkit-scrollbar {
            width: 6px;
        }

        #messages::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        .row {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            max-width: 78%;
            animation: rise 0.18s ease-out;
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .row.own {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 11px;
            font-weight: 700;
        }

        .bubble-group {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .sender {
            font-size: 11.5px;
            color: var(--text-muted);
            margin: 0 4px;
        }

        .bubble {
            padding: 9px 13px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
            background: var(--bubble-other);
            color: var(--text);
            border-bottom-left-radius: 4px;
        }

        .row.own .bubble {
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            color: white;
            border-bottom-left-radius: 16px;
            border-bottom-right-radius: 4px;
        }

        .time {
            font-size: 10px;
            color: var(--text-muted);
            margin: 0 4px;
        }

        .row.own .time {
            text-align: right;
        }

        .system-msg {
            align-self: center;
            font-size: 11.5px;
            color: var(--text-muted);
            background: var(--bubble-other);
            padding: 5px 12px;
            border-radius: 20px;
            margin: 4px 0;
        }

        /* ---------- Input bar ---------- */
        .input-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 14px 16px;
            border-top: 1px solid var(--border);
            flex-shrink: 0;
        }

        .input-bar input {
            flex: 1;
            padding: 11px 16px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-size: 14px;
            outline: none;
            transition: border-color 0.15s;
        }

        .input-bar input:focus {
            border-color: var(--accent);
        }

        .input-bar input:disabled {
            opacity: 0.5;
        }

        .send-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: transform 0.1s, opacity 0.15s;
        }

        .send-btn:hover {
            opacity: 0.92;
        }

        .send-btn:active {
            transform: scale(0.94);
        }

        .send-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
    </style>
</head>

<body>
    <!-- Join screen -->
    <div id="joinScreen">
        <div class="logo">💬</div>
        <h1>Join a chat room</h1>
        <p class="sub">Pick a name and a room to start chatting</p>
        <input id="usernameInput" placeholder="Your name" autocomplete="off" />
        <input id="roomInput" placeholder="Room name" autocomplete="off" />
        <button id="joinBtn">Join Chat</button>
    </div>

    <!-- Chat screen -->
    <div id="chatScreen">
        <header>
            <div class="room-info">
                <div class="room-icon" id="roomIcon"></div>
                <div>
                    <div class="room-name" id="roomNameLabel"></div>
                    <div class="status"><span class="dot" id="statusDot"></span><span
                            id="statusText">Connecting…</span></div>
                </div>
            </div>
        </header>
        <div id="messages"></div>
        <div class="input-bar">
            <input id="msgInput" placeholder="Type a message…" autocomplete="off" disabled />
            <button class="send-btn" id="sendBtn" disabled>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                    <path d="M4 20L21 12L4 4V10L16 12L4 14V20Z" fill="currentColor" />
                </svg>
            </button>
        </div>
    </div>

    <script>
        const joinScreen = document.getElementById("joinScreen");
        const chatScreen = document.getElementById("chatScreen");
        const usernameInput = document.getElementById("usernameInput");
        const roomInput = document.getElementById("roomInput");
        const joinBtn = document.getElementById("joinBtn");

        const messagesDiv = document.getElementById("messages");
        const input = document.getElementById("msgInput");
        const sendBtn = document.getElementById("sendBtn");
        const statusDot = document.getElementById("statusDot");
        const statusText = document.getElementById("statusText");
        const roomIcon = document.getElementById("roomIcon");
        const roomNameLabel = document.getElementById("roomNameLabel");

        let username = "";
        let room = "";
        let ws = null;

        function colorFor(name) {
            let hash = 0;
            for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
            const hue = Math.abs(hash) % 360;
            return `hsl(${hue}, 62%, 52%)`;
        }

        function initials(name) {
            return name.trim().slice(0, 2).toUpperCase();
        }

        function formatTime() {
            return new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
        }

        function addSystemMessage(text) {
            const el = document.createElement("div");
            el.className = "system-msg";
            el.textContent = text;
            messagesDiv.appendChild(el);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function addChatMessage(sender, text) {
            const isOwn = sender === username;

            const row = document.createElement("div");
            row.className = "row" + (isOwn ? " own" : "");

            const avatar = document.createElement("div");
            avatar.className = "avatar";
            avatar.style.background = colorFor(sender);
            avatar.textContent = initials(sender);

            const group = document.createElement("div");
            group.className = "bubble-group";

            if (!isOwn) {
                const senderEl = document.createElement("div");
                senderEl.className = "sender";
                senderEl.textContent = sender;
                group.appendChild(senderEl);
            }

            const bubble = document.createElement("div");
            bubble.className = "bubble";
            bubble.textContent = text;
            group.appendChild(bubble);

            const time = document.createElement("div");
            time.className = "time";
            time.textContent = formatTime();
            group.appendChild(time);

            row.appendChild(avatar);
            row.appendChild(group);
            messagesDiv.appendChild(row);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function setConnected(connected) {
            statusDot.classList.toggle("connected", connected);
            statusText.textContent = connected ? "Connected" : "Disconnected";
            input.disabled = !connected;
            sendBtn.disabled = !connected;
        }

        function connect() {
            roomIcon.textContent = initials(room);
            roomNameLabel.textContent = "#" + room;

            ws = new WebSocket(`ws://localhost:8000/ws/${room}/${username}`);

            ws.onopen = () => {
                setConnected(true);
                addSystemMessage("You joined as " + username);
            };
            ws.onclose = () => {
                setConnected(false);
                addSystemMessage("Disconnected from server");
            };
            ws.onerror = () => addSystemMessage("Connection error");

            ws.onmessage = (event) => {
                const raw = event.data;
                const sepIndex = raw.indexOf(": ");
                if (sepIndex === -1) {
                    addSystemMessage(raw);
                } else {
                    const sender = raw.slice(0, sepIndex);
                    const text = raw.slice(sepIndex + 2);
                    addChatMessage(sender, text);
                }
            };
        }

        function sendMessage() {
            const text = input.value.trim();
            if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;

            const payload = JSON.stringify({ username: username, message: text });
            ws.send(payload);
            input.value = "";
        }

        function join() {
            username = usernameInput.value.trim() || "Anonymous";
            room = roomInput.value.trim() || "room1";

            joinScreen.style.display = "none";
            chatScreen.style.display = "flex";
            connect();
        }

        joinBtn.addEventListener("click", join);
        [usernameInput, roomInput].forEach((el) => {
            el.addEventListener("keydown", (e) => {
                if (e.key === "Enter") join();
            });
        });

        sendBtn.addEventListener("click", sendMessage);
        input.addEventListener("keydown", (e) => {
            if (e.key === "Enter") sendMessage();
        });
    </script>
</body>

</html>
